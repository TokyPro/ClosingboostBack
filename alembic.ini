[alembic]
script_location = %(here)s/alembic
version_locations = %(here)s/alembic/versions
relative_to = %(here)s/alembic.ini

sqlalchemy.url = sqlite+aiosqlite:///./salesboost.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = formatter_a

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = formatter_a

[logger_root]
level = WARN
handlers = console
qualname = 
propagate = 0

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy
propagate = 0

[logger_alembic]
level = WARN
handlers = console
qualname = alembic
propagate = 0

[formatter_formatter_a]
class = logging.Formatter
format = %(asctime)s %(levelname)s %(name)s %(message)s